# Bouwt de container-image.
# - Push naar main: bouwen én zetten op ghcr.io/<gebruikersnaam>/<repo>; Unraid haalt die op.
# - Push naar dev: alleen bouwen, als controle. Er wordt niets gepubliceerd, dus de
#   versie op Unraid verandert niet.
name: Container bouwen

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLISH: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      # ghcr.io accepteert alleen kleine letters in de naam van een image
      - name: Naam van de image bepalen
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 'latest' is altijd de nieuwste versie; de commit-code maakt teruggaan naar
      # een eerdere versie mogelijk
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      # Controle: start de container en kijk of het portaal antwoordt
      - name: Container starten en testen
        run: |
          docker run -d --name test -p 8080:8080 ${{ steps.image.outputs.name }}:${{ github.sha }}
          for i in $(seq 1 20); do curl -fsS http://localhost:8080/api/session && break; sleep 1; done
          curl -fsS http://localhost:8080/portaal/ > /dev/null
          docker exec test python -c "import anthropic; print('anthropic', anthropic.__version__)"
          docker logs test
